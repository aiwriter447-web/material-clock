name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Show icon files
        run: |
          echo "--- mipmap-anydpi-v26 folder ---"
          ls -la app/src/main/res/mipmap-anydpi-v26/ || echo "folder not found"
          echo "--- searching everywhere for ic_launcher ---"
          find app/src/main/res -iname "*ic_launcher*"
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Material-Clock-APK
          path: app/build/outputs/apk/debug/*.apk