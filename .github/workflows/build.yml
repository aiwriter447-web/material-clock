name: Build Android APK Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Recreate debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Force Remove Gradle Wrapper Configuration
        run: rm -f gradle/wrapper/gradle-wrapper.properties

      - name: Setup Fresh Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Execute Gradle Build
        run: gradle assembleDebug

      - name: Export APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Material-Clock-APK
          path: app/build/outputs/apk/debug/*.apk
